version: '3.8'

services:
  # Backend service - FastAPI application
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: portfolio-backend
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
    networks:
      - portfolio-network
    restart: unless-stopped

  # Frontend service - React application
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: portfolio-frontend
    ports:
      - "5173:80"  # Map host port 5173 to container port 80 (nginx)
    depends_on:
      - backend
    networks:
      - portfolio-network
    restart: unless-stopped

  # Stockfish Chess Engine Service
  stockfish:
    image: ivangabriele/dockfish:15
    container_name: portfolio-stockfish
    environment:
      - PORT=4000
      - API_TOKEN=${STOCKFISH_API_TOKEN:-development_token}
      - DOMAIN=*
    ports:
      - "4000:4000"
    networks:
      - portfolio-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "4000"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

# Custom network for service communication
networks:
  portfolio-network:
    driver: bridge