version: '3.8'

services:
  # Backend service - FastAPI application
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: portfolio-backend
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
    networks:
      - portfolio-network
    restart: unless-stopped

  # Frontend service - React application
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: portfolio-frontend
    ports:
      - "5173:80"  # Map host port 5173 to container port 80 (nginx)
    depends_on:
      - backend
    networks:
      - portfolio-network
    restart: unless-stopped

  # Chess MCP Server - Chess.com API integration
  # chess-mcp:
  #   build:
  #     context: ./chess-mcp
  #     dockerfile: Dockerfile
  #   container_name: portfolio-chess-mcp
  #   ports:
  #     - "8001:8000"  # Map host port 8001 to container port 8000
  #   environment:
  #     - PYTHONUNBUFFERED=1
  #     - PYTHONDONTWRITEBYTECODE=1
  #     - PYTHONPATH=/app
  #   networks:
  #     - portfolio-network
  #   restart: unless-stopped
  #   healthcheck:
  #     test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
  #     interval: 30s
  #     timeout: 5s
  #     retries: 3
  #     start_period: 10s

# Custom network for service communication
networks:
  portfolio-network:
    driver: bridge